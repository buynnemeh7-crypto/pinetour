<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="flex justify-center">
      <div
        style="background-image: url(first.png); background-size: cover"
        class="w-360 h-193"
      >
        <div class="flex items-center justify-center">
          <div class="w-301 h-11 flex justify-between pt-6 items-center">
            <div class="w-23 h-10"><img src="tour.png" alt="" /></div>
            <div
              class="font-semiboid text-l text-white w-98 h-3 flex gap-10 items-center"
            >
              <a href="">Home</a>
              <a href="">About</a>
              <a href="">Contact</a>
              <div><img src="Vector.png" alt="" /></div>
            </div>

            <button
              class="rounded-full h-7 w-7 text-black bg-white first items-center text-sm justify-center"
            >
              EN
            </button>
          </div>
        </div>
        <div class="flex items-center justify-center mt-20">
          <div
            class="w-154 h-98 flex items-center justify-cente flex-col gap-5"
          >
            <img src="Pure magic (1).png" alt="" />
            <h1
              class="text-[#FDFDFEFA] text-[200px] font-normal leading-none"
              style="
                font-family:
                  Impact, Haettenschweiler, &quot;Arial Narrow Bold&quot;,
                  sans-serif;
              "
            >
              AWAITS!
            </h1>
            <h1 class="text-[#FFFFFFCC] text-[40px] font-bold leading-none">
              2024
            </h1>
          </div>
        </div>
      </div>
    </div>
    <div class="flex justify-center">
      <div class="w-360 h-125 bg-sky-100 flex justify-center #EEE9D9">
        <div class="bg-contain flex gap-10 justify-center items-center">
          <img class="w-68 h-92 rounded-4xl bg-contain" src="lake.png" alt="" />
          <img class="w-68 h-92 rounded-4xl bg-contain" src="sm.png" alt="" />
          <img class="w-68 h-92 rounded-4xl bg-contain" src="khu.png" alt="" />
          <img class="w-68 h-92 rounded-4xl bg-contain" src="togo.png" alt="" />
        </div>
      </div>
    </div>
    <div class="flex justify-evenly">
      <div
        class="bg-[url(map.png)] w-360 h-225 bg-cover pt-20 pl-20 flex flex-col gap-8"
      >
        <h1 class="text-4xl flex items-center justify-center">
          Destination of Our Agency
        </h1>
        <p class="flex items-center justify-center">
          Pack your bags and get ready
        </p>
        <div
          class="w-118 h-25 rounded-full bg-[#EEE9D9] flex items-center justify-evenly gap-40 hover:scale-[1.02] transition-transform"
        >
          <div>
            <h1 class="font-medium">Sukhbaatar square</h1>
            <img src="Location Details.png" alt="" />
          </div>
          <button class="w-13 h-12 rounded-full bg-[#F7F6F3]">DAY 1</button>
        </div>
        <div
          class="w-118 h-25 rounded-full bg-[#8BB8C1CC] flex items-center justify-evenly gap-27 hover:scale-[1.02] transition-transform"
        >
          <div>
            <h1 class="font-medium">Amarbaysgalant monastery</h1>
            <img src="Location Details (1).png" alt="" />
          </div>
          <button class="w-13 h-12 rounded-full bg-[#F7F6F3]">DAY 2</button>
        </div>
        <div
          class="w-118 h-25 rounded-full bg-[#AAD8D7CC] flex items-center justify-evenly gap-50 hover:scale-[1.02] transition-transform"
        >
          <div>
            <h1 class="font-medium">Khorgiin togoo</h1>
            <img src="Location Details (1) copy.png" alt="" />
          </div>
          <button class="w-13 h-12 rounded-full bg-[#F7F6F3]">DAY 3</button>
        </div>
        <div
          class="w-118 h-25 rounded-full bg-[#8BC0BDCC] flex items-center justify-evenly gap-40 hover:scale-[1.02] transition-transform"
        >
          <div>
            <h1 class="font-medium">Terkhiin tsagaan lake</h1>
            <img src="Location Details (1) copy.png" alt="" />
          </div>
          <button class="w-13 h-12 rounded-full bg-[#F7F6F3]">DAY 4</button>
        </div>
        <div
          class="w-118 h-25 rounded-full bg-[#97CCE0CC] flex items-center justify-evenly gap-55 hover:scale-[1.02] transition-transform"
        >
          <div>
            <h1 class="font-medium">Khuvsgul lake</h1>
            <img src="Location Details (1) copy 2.png" alt="" />
          </div>
          <button class="w-13 h-12 rounded-full bg-[#F7F6F3]">DAY 5</button>
        </div>
      </div>
    </div>
    <div class="flex justify-center">
      <div class="bg-[url(BLUR.png)] w-360 h-143 bg-[#9FC6DE] w-360 h-143 r">
        <h1 class="text-4xl flex items-center justify-center">
          Pricing of Our Agency
        </h1>
        <p class="flex items-center justify-center">
          Choose a package that’s right for you
        </p>
      </div>
    </div>

</html>
